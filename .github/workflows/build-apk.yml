name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android manifest for file access permissions
        run: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()

          perms = (
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
              '    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n'
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n'
          )
          if 'READ_MEDIA_AUDIO' not in content:
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n' + perms, content, count=1)

          if 'android:requestLegacyExternalStorage' not in content:
              content = re.sub(
                  r'(<application\b)',
                  r'\1 android:requestLegacyExternalStorage="true"',
                  content, count=1
              )

          with open(path, "w") as f:
              f.write(content)
          print("Patched AndroidManifest.xml")
          PYEOF

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mixtape-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
